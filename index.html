<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Chấm Thi Tin Học</title>
    <style>
        /* Toàn bộ phần CSS giữ nguyên như cũ để làm đẹp giao diện */
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; padding: 20px; }
        .quiz-container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
        h2 { color: #2c3e50; text-align: center; }
        input { width: 96%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 5px; }
        .question { margin-top: 20px; margin-bottom: 10px; font-weight: bold; color: #34495e; }
        .options { list-style: none; padding: 0; }
        .options li { margin: 10px 0; padding: 12px; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .options li:hover { background-color: #e1f5fe; }
        .options li.selected { background-color: #03a9f4; color: white; border-color: #03a9f4; }
        button { width: 100%; padding: 15px; background: #27ae60; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 20px; }
        #result { margin-top: 20px; text-align: center; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>

<div class="quiz-container">
    <h2>ÔN TẬP BÀI 2 - Tin 12</h2>
    <hr>
    <input type="text" id="hoTen" placeholder="Nhập Họ và Tên học sinh">
    <input type="text" id="lop" placeholder="Nhập Lớp (Ví dụ: 10A1)">

    <div id="quiz">
        </div>

    <button onclick="submitQuiz()" id="btnSubmit">Nộp Bài & Chấm Điểm</button>
    <div id="result"></div>
</div>

<script>
    // 1. DỮ LIỆU CÂU HỎI
    const quizData = [
        { q: "Phần mềm IBM Watson for Oncology được ứng dụng trong lĩnh vực nào để hỗ trợ đưa ra các chẩn đoán và hướng điều trị?", options: [ "Tài chính - Ngân hàng", "Y học và chăm sóc sức khỏe", "Giao thông vận tải", "Giáo dục"], answer: 1 },
	{ q: "Ban đầu, hệ chuyên gia là chương trình máy tính được thiết kế dựa trên các yếu tố nào?", options: [ "Dữ liệu thời tiết và bản đồ vệ tinh", "Các thuật toán sinh video tự động", "Các luật suy diễn và tri thức của chuyên gia trong từng lĩnh vực cụ thể", "Khả năng tự động cập nhật chứng từ ngân hàng"], answer: 2 },
	{ q: "Sự kết hợp giữa AI và công nghệ nào cho phép các nhà khoa học giám sát môi trường tự nhiên và theo dõi tình hình biến đổi khí hậu?", options: [ "IoT (AIoT)", "Blockchain", "Cloud Computing", "3D Printing"], answer: 0 },
	{ q: "Trong lĩnh vực nông nghiệp, AI giúp người nông dân thực hiện công việc nào sau đây?", options: [ "Thay thế hoàn toàn con người trong mọi khâu tiếp thị nông sản", "Tối ưu hoá quy trình chăm sóc vật nuôi, cây trồng và dự đoán mùa vụ", "Cung cấp tín dụng trực tiếp cho các trang trại", "Tự động thanh toán hóa đơn vật tư nông nghiệp"], answer: 1 },
	{ q: "Các trợ lý học tập ảo dựa trên AI trong giáo dục hỗ trợ người học và giáo viên bằng cách nào?", options: [ "Tự động cấp bằng tốt nghiệp cho học sinh", "Trả lời câu hỏi, cung cấp hướng dẫn và tài liệu học tập", "Thay thế hoàn toàn giáo viên giảng dạy trên lớp", "Soạn thảo toàn bộ chương trình giáo dục quốc gia"], answer: 1 },
	{ q: "AI tạo sinh (Generative AI) tập trung vào việc nào sau đây?", options: [ "Chỉ quét và phát hiện vi-rút trên máy tính", "Xây dựng các thuật toán và mô hình có thể tạo nội dung (hình ảnh, âm thanh, văn bản) một cách tự động", "Tăng tốc độ truy cập Internet cá nhân", "Tự động hóa các giao dịch ngân hàng truyền thống"], answer: 1 },
	{ q: "ChatGPT là một hệ thống xử lý ngôn ngữ tiên tiến do tổ chức/công ty nào phát triển?", options: [ "Google", "Microsoft", "OpenAI", "IBM"], answer: 2 },
 	{ q: "Đâu không phải là một trong những cảnh báo/nguy cơ liên quan đến sự phát triển của AI được nêu trong bài học?", options: [ "Áp lực thất nghiệp do tự động hóa", "Ảnh hưởng quyền riêng tư", "Làm giảm hoàn toàn tốc độ xử lý của máy tính trong tương lai", "Khả năng thiếu minh bạch (‘hộp đen’)"], answer: 2 },
	{ q: "Hầu hết các thành tựu hiện tại của AI nói chung (như ChatGPT, hệ thống nhận dạng...) đang thuộc phạm vi nào?", options: [ "Trí tuệ nhân tạo hẹp / Trí tuệ nhân tạo yếu", "Trí tuệ nhân tạo tổng quát / Trí tuệ nhân tạo mạnh", "Trí tuệ nhân tạo siêu việt", "Trí tuệ nhân tạo toàn năng"], answer: 0 },
	{ q: "Thuật ngữ ‘hộp đen’ trong cảnh báo về AI phản ánh đặc điểm nào của các ứng dụng AI hiện nay?", options: [ "AI chỉ hoạt động được trong môi trường không có ánh sáng", "Phần lớn ứng dụng AI gây khó khăn cho việc hiểu các quyết định được đưa ra như thế nào, dẫn đến thiếu minh bạch", "Thiết bị phần cứng của AI bắt buộc phải đóng trong hộp màu đen", "Dữ liệu của AI không thể lưu trữ trên máy tính"], answer: 1 },
    ];

    let userAnswers = new Array(quizData.length).fill(null);

    // 2. HÀM HIỂN THỊ CÂU HỎI
    function loadQuiz() {
        const quizDiv = document.getElementById('quiz');
        let html = '';
        quizData.forEach((item, index) => {
            html += `
                <div class="question">Câu ${index + 1}: ${item.q}</div>
                <ul class="options">
                    ${item.options.map((opt, i) => `<li onclick="selectOption(${index}, ${i}, this)">${opt}</li>`).join('')}
                </ul>`;
        });
        quizDiv.innerHTML = html;
    }

    function selectOption(qIdx, oIdx, element) {
        userAnswers[qIdx] = oIdx;
        const siblings = element.parentElement.children;
        for (let sib of siblings) sib.classList.remove('selected');
        element.classList.add('selected');
    }

    // 3. HÀM CHẤM ĐIỂM VÀ GỬI DỮ LIỆU (VIẾT CHUNG VÀO ĐÂY)
    async function submitQuiz() {
        const hoTen = document.getElementById('hoTen').value.trim();
        const lop = document.getElementById('lop').value.trim();

        if (!hoTen || !lop) {
            alert("Em điền tên và lớp nhé!");
            return;
        }

        let score = 0;
        quizData.forEach((item, idx) => {
            if (userAnswers[idx] === item.answer) score++;
        });

        const finalScore = (score / quizData.length) * 10;
        const resultDiv = document.getElementById('result');
        resultDiv.innerHTML = "🔄 Đang gửi điểm về máy thầy...";

        // --- KẾT NỐI GOOGLE SHEETS ---
        // ANH DÁN LINK APPS SCRIPT CỦA ANH VÀO DÒNG DƯỚI ĐÂY
        const scriptURL = 'https://script.google.com/macros/s/AKfycbw-r88IGZT95MUe-wEayxQWQmT0njWf58ReGAxoLRYj7nSjYwIwj_ml2rAtYxs3aStg/exec';
        
        const payload = {
            hoTen: hoTen,
            lop: lop,
            soCauDung: score,
            diem: finalScore.toFixed(1)
        };

        try {
            await fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(payload),
                headers: { 'Content-Type': 'application/json' }
            });

            resultDiv.innerHTML = `✅ Thành công! <br> Học sinh: ${hoTen} - Lớp: ${lop} <br> Điểm: ${finalScore.toFixed(1)}`;
            resultDiv.style.color = "#27ae60";
            
            // Khóa bài thi
            document.getElementById('btnSubmit').disabled = true;
            document.getElementById('btnSubmit').style.background = "#bdc3c7";
            document.getElementById('btnSubmit').innerText = "ĐÃ LƯU ĐIỂM";
            document.querySelectorAll('.options li').forEach(li => li.style.pointerEvents = 'none');

        } catch (error) {
            resultDiv.innerHTML = "❌ Lỗi gửi dữ liệu rồi em!";
            resultDiv.style.color = "#e74c3c";
        }
    }

    loadQuiz(); // Khởi chạy khi mở trang
</script>

</body>
</html>
