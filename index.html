<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Chấm Thi Tin Học</title>
    <style>
        /* Toàn bộ phần CSS giữ nguyên như cũ để làm đẹp giao diện */
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; padding: 20px; }
        .quiz-container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
        h2 { color: #2c3e50; text-align: center; }
        input { width: 96%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 5px; }
        .question { margin-top: 20px; margin-bottom: 10px; font-weight: bold; color: #34495e; }
        .options { list-style: none; padding: 0; }
        .options li { margin: 10px 0; padding: 12px; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .options li:hover { background-color: #e1f5fe; }
        .options li.selected { background-color: #03a9f4; color: white; border-color: #03a9f4; }
        button { width: 100%; padding: 15px; background: #27ae60; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 20px; }
        #result { margin-top: 20px; text-align: center; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>

<div class="quiz-container">
    <h2>ÔN TẬP BÀI 3 - Tin 11</h2>
    <hr>
    <input type="text" id="hoTen" placeholder="Nhập Họ và Tên học sinh">
    <input type="text" id="lop" placeholder="Nhập Lớp (Ví dụ: 10A1)">

    <div id="quiz">
        </div>

    <button onclick="submitQuiz()" id="btnSubmit">Nộp Bài & Chấm Điểm</button>
    <div id="result"></div>
</div>

<script>
    // 1. DỮ LIỆU CÂU HỎI
    const quizData = [
        { q: "Văn bản chương trình do người lập trình viết bằng ngôn ngữ lập trình bậc cao được gọi là gì?", options: [ "Mã máy (Machine code)", "Mã nguồn (Source code)", "Mã nhị phân (Binary code)", "Phần mềm thương mại (Commercial software)"], answer: 1 },
	{ q: "Phần mềm thương mại thường được chuyển giao cho người sử dụng dưới dạng nào?", options: [ "Cung cấp cả mã nguồn và mã máy", "Chỉ cung cấp mã nguồn để người dùng chỉnh sửa", "Dạng mã máy (mã đóng) để bảo vệ bản quyền và chống sửa đổi", "Miễn phí hoàn toàn không điều kiện"], answer: 2 },
       	{ q: "Khái niệm ‘Phần mềm tự do’ (Free software) được hiểu đúng nhất là:", options: [ "Phần mềm chỉ cho phép người dùng chạy thử 30 ngày", "Phần mềm không chỉ miễn phí mà còn cho phép người dùng tự do sử dụng, học tập, sửa đổi và phân phối lại mà không cần xin phép", "Phần mềm bắt buộc phải mua bản quyền hàng năm", "Phần mềm chỉ chạy trực tuyến trên nền web"], answer: 1 },
	{ q: "Giấy phép công cộng phổ biến nhất được áp dụng rộng rãi cho các phần mềm nguồn mở hiện nay là:", options: [ "Microsoft EULA", "Adobe End User License", "GNU GPL (GNU General Public License)", "ISO 9001 License"], answer: 2 },
	{ q: "Điều kiện BẮT BUỘC khi một người sửa đổi và phân phối lại một phần mềm nguồn mở được phát hành theo giấy phép GNU GPL là gì?", options: [ "Phải giữ kín mã nguồn phần phần mới sửa đổi", "Phải bán phần mềm với giá cao hơn phiên bản gốc", "Phải công khai mã nguồn của bản sửa đổi và tiếp tục áp dụng giấy phép GNU GPL cho bản đó", "Phải xóa tên tác giả ban đầu ra khỏi phần mềm"], answer: 2 },
	{ q: "Phần mềm nào sau đây là ví dụ tiêu biểu về phần mềm đồ họa nguồn mở?", options: [ "Adobe Photoshop", "CorelDRAW", "GIMP", "MS Paint"], answer: 2 },
	{ q: "Ưu điểm nổi bật nhất của phần mềm nguồn mở so với phần mềm thương mại là gì?", options: [ "Chi phí thấp, tính minh bạch cao (kiểm soát được mã nguồn) và không bị phụ thuộc vào một nhà cung cấp", "Luôn có tổng đài hỗ trợ kỹ thuật trực 24/7 từ nhà sản xuất", "Được thiết kế dành riêng (‘may-đo’) theo yêu cầu đặc thù của từng cá nhân", "Tất cả các tính năng nâng cao đều tự động cài đặt mà không cần kết nối mạng"], answer: 0 },
       	{ q: "Nhược điểm chính của phần mềm thương mại dạng ‘đóng gói’ (như Microsoft Office, Photoshop) là gì?", options: [ "Không thể dùng được trên máy tính cá nhân", "Chi phí mua bản quyền thường đắt và người dùng dễ bị phụ thuộc vào nhà cung cấp", "Không có giao diện đồ họa cho người dùng", "Bắt buộc người dùng phải tự biên dịch mã nguồn trước khi dùng"], answer: 1 },
	{ q: "Đặc điểm nào sau đây mô tả ĐÚNG nhất về ‘Phần mềm chạy trên Internet’ (Phần mềm trực tuyến)?", options: [ "Là phần mềm chỉ cài đặt được trên hệ điều hành Linux", "Là phần mềm cho phép người dùng sử dụng trực tiếp qua trình duyệt web mà không cần cài đặt vào máy", "Là phần mềm chỉ mở được khi máy tính bị mất kết nối mạng", "Là phần mềm bắt buộc phải cài đặt bằng tệp tin .exe"], answer: 1 },
	{ q: "Ứng dụng nào dưới đây KHÔNG PHẢI là phần mềm chạy trên Internet?", options: [ "Google Docs", "Canva (bản web)", "Google Sheets", "Phần mềm soạn thảo văn bản Microsoft Word 2003 (chạy offline trên máy tính)"], answer: 3 },
    ];

    let userAnswers = new Array(quizData.length).fill(null);

    // 2. HÀM HIỂN THỊ CÂU HỎI
    function loadQuiz() {
        const quizDiv = document.getElementById('quiz');
        let html = '';
        quizData.forEach((item, index) => {
            html += `
                <div class="question">Câu ${index + 1}: ${item.q}</div>
                <ul class="options">
                    ${item.options.map((opt, i) => `<li onclick="selectOption(${index}, ${i}, this)">${opt}</li>`).join('')}
                </ul>`;
        });
        quizDiv.innerHTML = html;
    }

    function selectOption(qIdx, oIdx, element) {
        userAnswers[qIdx] = oIdx;
        const siblings = element.parentElement.children;
        for (let sib of siblings) sib.classList.remove('selected');
        element.classList.add('selected');
    }

    // 3. HÀM CHẤM ĐIỂM VÀ GỬI DỮ LIỆU (VIẾT CHUNG VÀO ĐÂY)
    async function submitQuiz() {
        const hoTen = document.getElementById('hoTen').value.trim();
        const lop = document.getElementById('lop').value.trim();

        if (!hoTen || !lop) {
            alert("Em điền tên và lớp nhé!");
            return;
        }

        let score = 0;
        quizData.forEach((item, idx) => {
            if (userAnswers[idx] === item.answer) score++;
        });

        const finalScore = (score / quizData.length) * 10;
        const resultDiv = document.getElementById('result');
        resultDiv.innerHTML = "🔄 Đang gửi điểm về máy thầy...";

        // --- KẾT NỐI GOOGLE SHEETS ---
        // ANH DÁN LINK APPS SCRIPT CỦA ANH VÀO DÒNG DƯỚI ĐÂY
        const scriptURL = 'https://script.google.com/macros/s/AKfycbw-r88IGZT95MUe-wEayxQWQmT0njWf58ReGAxoLRYj7nSjYwIwj_ml2rAtYxs3aStg/exec';
        
        const payload = {
            hoTen: hoTen,
            lop: lop,
            soCauDung: score,
            diem: finalScore.toFixed(1)
        };

        try {
            await fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(payload),
                headers: { 'Content-Type': 'application/json' }
            });

            resultDiv.innerHTML = `✅ Thành công! <br> Học sinh: ${hoTen} - Lớp: ${lop} <br> Điểm: ${finalScore.toFixed(1)}`;
            resultDiv.style.color = "#27ae60";
            
            // Khóa bài thi
            document.getElementById('btnSubmit').disabled = true;
            document.getElementById('btnSubmit').style.background = "#bdc3c7";
            document.getElementById('btnSubmit').innerText = "ĐÃ LƯU ĐIỂM";
            document.querySelectorAll('.options li').forEach(li => li.style.pointerEvents = 'none');

        } catch (error) {
            resultDiv.innerHTML = "❌ Lỗi gửi dữ liệu rồi em!";
            resultDiv.style.color = "#e74c3c";
        }
    }

    loadQuiz(); // Khởi chạy khi mở trang
</script>

</body>
</html>
