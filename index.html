<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Chấm Thi Tin Học - Thầy Giáo 4.0</title>
    <style>
        /* Toàn bộ phần CSS giữ nguyên như cũ để làm đẹp giao diện */
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; padding: 20px; }
        .quiz-container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
        h2 { color: #2c3e50; text-align: center; }
        input { width: 96%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 5px; }
        .question { margin-top: 20px; margin-bottom: 10px; font-weight: bold; color: #34495e; }
        .options { list-style: none; padding: 0; }
        .options li { margin: 10px 0; padding: 12px; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .options li:hover { background-color: #e1f5fe; }
        .options li.selected { background-color: #03a9f4; color: white; border-color: #03a9f4; }
        button { width: 100%; padding: 15px; background: #27ae60; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 20px; }
        #result { margin-top: 20px; text-align: center; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>

<div class="quiz-container">
    <h2>KIỂM TRA TX2 - TIN 11</h2>
    <hr>
    <input type="text" id="hoTen" placeholder="Nhập Họ và Tên học sinh">
    <input type="text" id="lop" placeholder="Nhập Lớp (Ví dụ: 11A3)">

    <div id="quiz">
        </div>

    <button onclick="submitQuiz()" id="btnSubmit">Nộp Bài & Chấm Điểm</button>
    <div id="result"></div>
</div>

<script>
    // 1. DỮ LIỆU CÂU HỎI
    const quizData = [
        { q: "Tất cả các thiết bị bên trong thân máy tính đều được gắn với một bảng mạch gọi là gì?", options: [ "Bảng mạch chính (Mainboard)", "Bảng mạch mở rộng", "Bảng mạch ngoại vi", "Bộ xử lý trung tâm"], answer: 0 },
	{ q: "Bộ phận nào được coi là thành phần quan trọng nhất của máy tính, đảm nhận việc thực hiện các chương trình?", options: [ "Bộ nhớ ngoài", "Bộ xử lý trung tâm (CPU)", "Bộ nhớ RAM", "Cổng kết nối"], answer: 1 },
	{ q: "CPU được cấu tạo từ hai bộ phận chính nào?", options: [ "RAM và ROM", "ALU và Thanh ghi", "ALU và CU", "CU và Bộ nhớ đệm (Cache)"], answer: 2 },
	{ q: "Bộ phận ALU (Arithmetic & Logic Unit) trong CPU có chức năng gì?", options: [ "Phối hợp đồng bộ các thiết bị của máy tính", "Lưu trữ dữ liệu lâu dài", "Thực hiện tất cả các phép tính số học và lôgic", "Kiểm tra và khởi động máy tính"], answer: 2 },
	{ q: "Bộ phận CU (Control Unit) trong CPU có chức năng gì?", options: [ "Thực hiện các phép tính số học", "Phối hợp đồng bộ các thiết bị của máy tính, đảm bảo máy tính thực hiện đúng chương trình", "Lưu trữ các lệnh và dữ liệu đang được xử lý", "Lưu trữ dữ liệu hệ thống cố định"], answer: 1 },
	{ q: "Đơn vị nào thường được dùng để đánh giá tốc độ của CPU?", options: [ "MB (Megabyte)", "GB (Gigabyte)", "GHz (Gigahertz)", "FLOPS"], answer: 2 },
	{ q: "1 GHz tương ứng với bao nhiêu xung một giây?", options: [ "1 triệu xung", "10 triệu xung", "100 triệu xung", "1 tỉ xung"], answer: 3 },
	{ q: "Vùng nhớ đặc biệt trong CPU dùng để lưu trữ tạm thời các lệnh và dữ liệu đang được xử lý với tốc độ rất nhanh là gì?", options: [ "Bộ nhớ đệm (Cache)", "Thanh ghi (Register)", "ROM", "SSD"], answer: 1 },
 	{ q: "Bộ nhớ đệm (Cache) có vai trò gì trong CPU?", options: [ "Phối hợp các thiết bị ngoại vi", "Chứa dữ liệu được nạp trước từ bộ nhớ trong nhằm giảm thời gian đọc dữ liệu", "Thực hiện các phép tính lôgic XOR", "Lưu trữ chương trình kiểm tra máy tính lâu dài"], answer: 1 },
	{ q: "Mỗi đơn vị xử lý trong một chip CPU đa lõi được gọi là gì?", options: [ "Thanh ghi", "Xung đồng hồ", "Lõi hoặc nhân (Core)", "Mạch lôgic"], answer: 2 },
	{ q: "Bộ nhớ trong của máy tính được chia thành hai loại chính là gì?", options: [ "Đĩa cứng và Đĩa mềm", "RAM và ROM", "Cache và Thanh ghi", "Thẻ nhớ và Đĩa quang"], answer: 1 },
	{ q: "Đặc điểm nào sau đây là của bộ nhớ RAM?", options: [ "Chỉ có thể đọc mà không thể ghi hay xoá", "Dùng để lưu trữ dữ liệu lâu dài không cần nguồn nuôi", "Là bộ nhớ có thể ghi được, dùng để ghi dữ liệu tạm thời khi chạy chương trình (tắt máy dữ liệu bị xoá)", "Chứa các chương trình kiểm tra hay khởi động máy tính"], answer: 2 },
	{ q: "Đặc điểm nào sau đây là của bộ nhớ ROM?", options: [ "Dữ liệu bị xoá khi tắt máy", "Dùng để lưu trữ tạm thời các lệnh đang xử lý", "Không cần nguồn nuôi, lưu trữ dữ liệu/chương trình lâu dài (như chương trình khởi động)", "Có dung lượng lớn hơn RAM và thời gian truy cập nhanh hơn"], answer: 2 },
	{ q: "So với RAM, bộ nhớ ROM thường có đặc điểm nào sau đây?", options: [ "Dung lượng lớn hơn, thời gian truy cập nhỏ hơn", "Dung lượng nhỏ hơn, thời gian truy cập trung bình lớn hơn", "Dung lượng lớn hơn, thời gian truy cập lớn hơn", "Dung lượng và thời gian truy cập tương đương nhau"], answer: 1 },
	{ q: "Các tham số đo hiệu năng của bộ nhớ trong gồm có:", options: [ "Tần số xung clock và số lõi", "Dung lượng bộ nhớ và thời gian truy cập trung bình", "Kích thước vật lý và số cổng kết nối", "Số lượng bóng bán dẫn và điện áp"], answer: 1 },
	{ q: "Đơn vị tính dung lượng bộ nhớ trong thường gặp là:", options: [ "GHz hoặc MHz", "MB, GB (ví dụ 8 GB, 16 GB, 32 GB)", "Khóa K1, K2", "Bit/giây"], answer: 1 },
	{ q: "Ý nghĩa của việc giảm thời gian truy cập bộ nhớ trong là gì?", options: [ "Giúp giảm dung lượng lưu trữ của máy tính", "Tăng dung lượng bộ nhớ ngoài", "Nâng cao hiệu suất tổng thể của máy tính", "Giảm số lượng lõi trong CPU"], answer: 2 },
	{ q: "Thiết bị nào sau đây KHÔNG thuộc loại bộ nhớ ngoài?", options: [ "Đĩa từ (đĩa cứng)", "Đĩa thể rắn (SSD)", "Bộ nhớ RAM", "Đĩa quang / Thẻ nhớ USB"], answer: 2 },
 	{ q: "Ưu điểm của bộ nhớ ngoài so với RAM là gì?", options: [ "Tốc độ truy cập nhanh hơn rất nhiều", "Giá thành rẻ hơn RAM và có dung lượng lớn", "Luôn được gắn cố định bên trong CPU", "Không bị ảnh hưởng bởi từ trường"], answer: 1 },
	{ q: "So sánh tốc độ truy cập giữa các loại đĩa thuộc bộ nhớ ngoài:", options: [ "Đĩa quang nhanh hơn đĩa cứng và đĩa SSD", "Đĩa cứng (điện cơ) có tốc độ truy cập chậm hơn đĩa SSD nhưng nhanh hơn đĩa quang", "Đĩa SSD chậm hơn đĩa cứng", "Tất cả các loại đĩa đều có tốc độ như nhau"], answer: 1 },
	{ q: "Dung lượng của các bộ nhớ ngoài phổ biến hiện nay thường được tính bằng đơn vị nào?", options: [ "KB hoặc MB", "GB hoặc TB", "Hz hoặc GHz", "Byte hoặc Bit"], answer: 1 },
	{ q: "Về bản chất, CPU là một mạch điện tử dùng để biến đổi (xử lý) loại dữ liệu nào?", options: [ "Dữ liệu văn bản thô", "Dữ liệu nhị phân (các bit 0 và 1)", "Dữ liệu hình ảnh màu", "Dữ liệu âm thanh tương tự (Analog)"], answer: 1 },
	{ q: "Các đại lượng lôgic chỉ nhận một trong hai giá trị nào?", options: [ "Đúng (1) và Sai (0)", "Dương (+) và Âm (-)", "Mở và Tắt", "Cao và Thấp"], answer: 0 },
	{ q: "Phép nhân lôgic còn có tên gọi khác và kí hiệu là gì?", options: [ "Phép cộng lôgic (OR)", "Phép nhân lôgic (AND, kí hiệu ∧)", "Phép phủ định (NOT)", "Phép loại trừ (XOR)"], answer: 1 },
	{ q: "Phép nhân lôgic x AND y (x ∧ y) cho kết quả bằng 1 khi nào?", options: [ "Khi x = 1 hoặc y = 1", "Khi cả hai đại lượng x và y đều bằng 1", "Khi x và y khác giá trị nhau", "Khi cả hai đại lượng x và y đều bằng 0"], answer: 1 },
	{ q: "Phép cộng lôgic x OR y (x ∨ y) cho kết quả bằng 1 khi nào?", options: [ "Khi ít nhất một trong hai đại lượng x HOẶC y bằng 1", "Chỉ khi cả x và y đều bằng 1", "Khi x và y có giá trị bằng nhau", "Chỉ khi cả x và y đều bằng 0"], answer: 0 },
	{ q: "Phép phủ định lôgic NOT x (kí hiệu x̄) cho kết quả như thế nào?", options: [ "Phủ định của 0 là 0", "Phủ định của 1 là 1", "Phủ định của 0 là 1 và phủ định của 1 là 0", "Luôn cho kết quả là 1"], answer: 2 },
	{ q: "Phép hoặc loại trừ x XOR y (x ⊕ y) cho kết quả bằng 1 khi nào?", options: [ "Khi x và y cùng bằng 1", "Khi x và y cùng bằng 0", "Khi hai đại lượng x và y có giá trị khác nhau", "Khi hai đại lượng x và y có giá trị giống nhau"], answer: 2 },
 	{ q: "Trong mạch điện minh hoạ phép toán lôgic, rơ le điện tử thường đóng sẽ ngắt mạch điện khi nào?", options: [ "Khi không được cấp điện", "Khi được cấp điện", "Khi bóng đèn bị hỏng", "Khi dòng điện bằng 0"], answer: 1 },
	{ q: "Sơ đồ mạch điện thực hiện phép nhân lôgic (AND) sử dụng hai rơ le K1 và K2 mắc với nhau như thế nào?", options: [ "Mắc song song", "Mắc nối tiếp", "Mắc hỗn hợp", "Không cần mắc nối với nhau"], answer: 1 },
	{ q: "Sơ đồ mạch điện thực hiện phép cộng lôgic (OR) sử dụng hai rơ le K1 và K2 mắc với nhau như thế nào?", options: [ "Mắc nối tiếp", "Mắc song song", "Mắc nối tiếp với bóng đèn phủ định", "Mắc cầu"], answer: 1 },
	{ q: "Các mạch điện thực hiện các phép toán lôgic cơ bản (AND, OR, NOT, XOR,...) được gọi là gì?", options: [ "Cổng lôgic (Lôgic gate)", "Cổng kết nối ngoại vi", "Thanh ghi", "Đơn vị xử lý ALU"], answer: 0 },
	{ q: "Mạch lôgic (hay mạch số) được định nghĩa là gì?", options: [ "Mạch điện chứa bộ nhớ RAM và ROM", "Mạch điện hay điện tử có đầu vào và đầu ra thể hiện các giá trị lôgic", "Mạch kết nối đĩa cứng với mainboard", "Mắc điều khiển tốc độ quạt tản nhiệt"], answer: 1 },
	{ q: "Bất cứ mạch lôgic nào cũng có thể được xây dựng từ các cổng lôgic cơ bản nào?", options: [ "Chỉ từ cổng XOR", "Chỉ từ cổng NAND và NOR", "Các cổng AND, OR, NOT", "Các thanh ghi và bộ nhớ Cache"], answer: 2 },
	{ q: "Hệ nhị phân là hệ đếm chỉ sử dụng hai chữ số nào?", options: [ "1 và 2", "0 và 1", "0 và 2", "1 và 10"], answer: 1 },
	{ q: "Trong hệ nhị phân, giá trị của chữ số 1 ở hàng thứ k tính từ phải sang trái có giá trị bằng bao nhiêu?", options: [ "10^(k-1)", "2^(k-1)", "2^k", "k^2"], answer: 1 },
	{ q: "Số nhị phân 10011₂ có giá trị trong hệ thập phân là bao nhiêu?", options: [ "17", "18", "19", "21"], answer: 2 },
	{ q: "Khi thực hiện phép cộng hai số nhị phân 1 bit (x + y), trường hợp nào dưới đây phát sinh số nhớ bằng 1?", options: [ "x = 0, y = 0", "x = 0, y = 1", "x = 1, y = 0", "x = 1, y = 1"], answer: 3 },
 	{ q: "Khi cộng hai số 1 bit (x và y), kết quả thu được gồm số nhớ z và kết quả t. Công thức lôgic tương ứng của z và t là gì?", options: [ "z = x ∨ y và t = x ∧ y", "z = x ∧ y và t = x ⊕ y", "z = x ⊕ y và t = x ∧ y", "z = x̄ và t = ȳ"], answer: 1 },
	{ q: "Kết quả của phép cộng nhị phân 110₂ + 111₂ trong hệ nhị phân và hệ thập phân lần lượt là:", options: [ "1101₂ (bằng 13 trong hệ thập phân)", "1011₂ (bằng 11 trong hệ thập phân)", "1100₂ (bằng 12 trong hệ thập phân)", "1111₂ (bằng 15 trong hệ thập phân)"], answer: 0 },
    ];

    let userAnswers = new Array(quizData.length).fill(null);

    // 2. HÀM HIỂN THỊ CÂU HỎI
    function loadQuiz() {
        const quizDiv = document.getElementById('quiz');
        let html = '';
        quizData.forEach((item, index) => {
            html += `
                <div class="question">Câu ${index + 1}: ${item.q}</div>
                <ul class="options">
                    ${item.options.map((opt, i) => `<li onclick="selectOption(${index}, ${i}, this)">${opt}</li>`).join('')}
                </ul>`;
        });
        quizDiv.innerHTML = html;
    }

    function selectOption(qIdx, oIdx, element) {
        userAnswers[qIdx] = oIdx;
        const siblings = element.parentElement.children;
        for (let sib of siblings) sib.classList.remove('selected');
        element.classList.add('selected');
    }

    // 3. HÀM CHẤM ĐIỂM VÀ GỬI DỮ LIỆU (VIẾT CHUNG VÀO ĐÂY)
    async function submitQuiz() {
        const hoTen = document.getElementById('hoTen').value.trim();
        const lop = document.getElementById('lop').value.trim();

        if (!hoTen || !lop) {
            alert("Em điền tên và lớp nhé!");
            return;
        }

        let score = 0;
        quizData.forEach((item, idx) => {
            if (userAnswers[idx] === item.answer) score++;
        });

        const finalScore = (score / quizData.length) * 10;
        const resultDiv = document.getElementById('result');
        resultDiv.innerHTML = "🔄 Đang gửi điểm về máy thầy...";

        // --- KẾT NỐI GOOGLE SHEETS ---
        // ANH DÁN LINK APPS SCRIPT CỦA ANH VÀO DÒNG DƯỚI ĐÂY
        const scriptURL = 'https://script.google.com/macros/s/AKfycbw-r88IGZT95MUe-wEayxQWQmT0njWf58ReGAxoLRYj7nSjYwIwj_ml2rAtYxs3aStg/exec';
        
        const payload = {
            hoTen: hoTen,
            lop: lop,
            soCauDung: score,
            diem: finalScore.toFixed(1)
        };

        try {
            await fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(payload),
                headers: { 'Content-Type': 'application/json' }
            });

            resultDiv.innerHTML = `✅ Thành công! <br> Học sinh: ${hoTen} - Lớp: ${lop} <br> Điểm: ${finalScore.toFixed(1)}`;
            resultDiv.style.color = "#27ae60";
            
            // Khóa bài thi
            document.getElementById('btnSubmit').disabled = true;
            document.getElementById('btnSubmit').style.background = "#bdc3c7";
            document.getElementById('btnSubmit').innerText = "ĐÃ LƯU ĐIỂM";
            document.querySelectorAll('.options li').forEach(li => li.style.pointerEvents = 'none');

        } catch (error) {
            resultDiv.innerHTML = "❌ Lỗi gửi dữ liệu rồi em!";
            resultDiv.style.color = "#e74c3c";
        }
    }

    loadQuiz(); // Khởi chạy khi mở trang
</script>

</body>
</html>
